name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: mac
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Cache SonarQube packages
        if: matrix.os == 'linux'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: mvn -q clean test
      - name: Analyze with SonarQube
        if: matrix.os == 'linux'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=JCPrieto_ADS-Generator
      - name: Package app image
        run: mvn -q -Pjpackage-${{ matrix.os }} -DskipTests package
      - name: Create zip (Linux)
        if: matrix.os == 'linux'
        run: |
          cd target/dist
          zip -r "${{ github.workspace }}/ads-generator-${{ steps.version.outputs.VERSION }}-linux.zip" "ADS Generator"
      - name: Create zip (Windows)
        if: matrix.os == 'windows'
        run: |
          Compress-Archive -Path "target/dist/ADS Generator/*" -DestinationPath "$env:GITHUB_WORKSPACE/ads-generator-${{ steps.version.outputs.VERSION }}-windows.zip"
      - name: Create zip (mac)
        if: matrix.os == 'mac'
        run: |
          cd target/dist
          zip -r "${{ github.workspace }}/ads-generator-${{ steps.version.outputs.VERSION }}-mac.zip" "ADS Generator.app"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ads-generator-${{ steps.version.outputs.VERSION }}-${{ matrix.os }}
          path: ads-generator-${{ steps.version.outputs.VERSION }}-${{ matrix.os }}.zip

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)" >> "$GITHUB_OUTPUT"
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ads-generator-${{ steps.version.outputs.VERSION }}-*
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ads-generator-${{ steps.version.outputs.VERSION }}-linux.zip
            ads-generator-${{ steps.version.outputs.VERSION }}-windows.zip
            ads-generator-${{ steps.version.outputs.VERSION }}-mac.zip
