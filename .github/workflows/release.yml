name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-ubuntu22.04
            runner: ubuntu-22.04
            package_os: linux
            linux_suffix: ubuntu22.04
            create_linux_zip: true
          - os: linux-ubuntu24.04
            runner: ubuntu-24.04
            package_os: linux
            linux_suffix: ubuntu24.04
            create_linux_zip: false
          - os: windows
            runner: windows-latest
            package_os: windows
            create_linux_zip: false
          - os: mac
            runner: macos-latest
            package_os: mac
            create_linux_zip: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Cache SonarQube packages
        if: matrix.os == 'linux-ubuntu22.04'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: mvn -q clean test
      - name: Analyze with SonarQube
        if: matrix.os == 'linux-ubuntu22.04'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=JCPrieto_ADS-Generator
      - name: Package app image
        run: mvn -q -Pjpackage-${{ matrix.package_os }} -DskipTests package
      - name: Package deb (Linux)
        if: runner.os == 'Linux'
        run: mvn -q -Pjpackage-linux-deb -DskipTests package
      - name: Create zip (Linux)
        if: matrix.create_linux_zip
        run: |
          cd target/dist
          zip -r "${{ github.workspace }}/ads-generator-${{ steps.version.outputs.VERSION }}-linux.zip" "ADS Generator"
      - name: Rename deb (Linux)
        if: runner.os == 'Linux'
        run: |
          DEB_FILE=$(ls -1 target/dist/*.deb | head -n 1)
          if [ -z "$DEB_FILE" ]; then
            echo "No .deb found in target/dist"
            exit 1
          fi
          cp "$DEB_FILE" "ads-generator-${{ steps.version.outputs.VERSION }}-linux-${{ matrix.linux_suffix }}.deb"
      - name: Create zip (Windows)
        if: matrix.os == 'windows'
        run: |
          Compress-Archive -Path "target/dist/ADS Generator/*" -DestinationPath "$env:GITHUB_WORKSPACE/ads-generator-${{ steps.version.outputs.VERSION }}-windows.zip"
      - name: Create zip (mac)
        if: matrix.os == 'mac'
        run: |
          cd target/dist
          zip -r "${{ github.workspace }}/ads-generator-${{ steps.version.outputs.VERSION }}-mac.zip" "ADS Generator.app"
      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find . -maxdepth 1 -type f \( -name "ads-generator-${{ steps.version.outputs.VERSION }}-*.zip" -o -name "ads-generator-${{ steps.version.outputs.VERSION }}-*.deb" \) -exec cp {} release-assets/ \;
          if [ -z "$(find release-assets -type f -print -quit)" ]; then
            echo "No release assets were generated."
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ads-generator-${{ steps.version.outputs.VERSION }}-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)" >> "$GITHUB_OUTPUT"
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ads-generator-${{ steps.version.outputs.VERSION }}-*
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ads-generator-${{ steps.version.outputs.VERSION }}-linux.zip
            ads-generator-${{ steps.version.outputs.VERSION }}-linux-ubuntu22.04.deb
            ads-generator-${{ steps.version.outputs.VERSION }}-linux-ubuntu24.04.deb
            ads-generator-${{ steps.version.outputs.VERSION }}-windows.zip
            ads-generator-${{ steps.version.outputs.VERSION }}-mac.zip
      - name: Dispatch Ubuntu 22.04 deb to APT repo updater
        uses: actions/github-script@v7
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
          DEB_FILENAME: ads-generator-${{ steps.version.outputs.VERSION }}-linux-ubuntu22.04.deb
          DISTRO: ubuntu22.04
          APT_REPO_OWNER: ${{ vars.APT_REPO_OWNER }}
          APT_REPO_NAME: ${{ vars.APT_REPO_NAME }}
        with:
          github-token: ${{ secrets.APT_REPO_DISPATCH_TOKEN }}
          script: |
            const owner = process.env.APT_REPO_OWNER || 'JCPrieto';
            const repo = process.env.APT_REPO_NAME || 'jklabs-apt-repo';
            const appVersion = process.env.APP_VERSION;
            const debFilename = process.env.DEB_FILENAME;
            const distro = process.env.DISTRO;

            const releaseTag = `v${appVersion}`;
            const debUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${releaseTag}/${debFilename}`;

            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: 'deb-published',
              client_payload: {
                source_repository: `${context.repo.owner}/${context.repo.repo}`,
                package_name: 'ads-generator',
                version: appVersion,
                distro,
                component: 'main',
                architecture: 'amd64',
                release_tag: releaseTag,
                deb_filename: debFilename,
                deb_url: debUrl
              }
            });
