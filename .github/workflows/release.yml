name: Release

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: mac
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Get version
        id: version
        run: echo "VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" >> $GITHUB_OUTPUT
      - name: Run tests
        run: mvn -q clean test
      - name: Package app image
        run: mvn -q -Pjpackage-${{ matrix.os }} -DskipTests package
      - name: Create zip (Linux)
        if: matrix.os == 'linux'
        run: |
          cd target/dist
          zip -r "ads-generator-${{ steps.version.outputs.VERSION }}-linux.zip" "ADS Generator"
      - name: Create zip (Windows)
        if: matrix.os == 'windows'
        run: |
          Compress-Archive -Path "target/dist/ADS Generator/*" -DestinationPath "ads-generator-${{ steps.version.outputs.VERSION }}-windows.zip"
      - name: Create zip (mac)
        if: matrix.os == 'mac'
        run: |
          cd target/dist
          zip -r "ads-generator-${{ steps.version.outputs.VERSION }}-mac.zip" "ADS Generator.app"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ads-generator-${{ steps.version.outputs.VERSION }}-${{ matrix.os }}
          path: ads-generator-${{ steps.version.outputs.VERSION }}-${{ matrix.os }}.zip

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Get version
        id: version
        run: echo "VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" >> $GITHUB_OUTPUT
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ads-generator-${{ steps.version.outputs.VERSION }}-*
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            ads-generator-${{ steps.version.outputs.VERSION }}-linux.zip
            ads-generator-${{ steps.version.outputs.VERSION }}-windows.zip
            ads-generator-${{ steps.version.outputs.VERSION }}-mac.zip
